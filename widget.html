<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClashGuard Widget — Resource-Clash-Double-Booking-Detector</title>
    <meta name="description"
        content="Embeddable booking availability checker powered by Resource-Clash-Double-Booking-Detector." />
    <link rel="icon" href="data:," />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: #eef2f6;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        .widget-wrapper {
            max-width: 420px;
            margin: 0 auto;
            background: #0a0c0f;
            border: 1px solid #1b2028;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .9);
        }

        .widget-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .widget-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2dd4ea, #17a8bd);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .widget-title {
            font-size: 14px;
            font-weight: 700;
        }

        .widget-subtitle {
            font-size: 10.5px;
            color: #565f6b;
            margin-top: 2px;
        }

        .widget-badge {
            display: inline-block;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #2dd4ea;
            background: rgba(45, 212, 234, .12);
            border: 1px solid rgba(45, 212, 234, .3);
            padding: 2px 6px;
            border-radius: 3px;
            margin-bottom: 3px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }

        .field label {
            font-size: 11px;
            color: #8b96a5;
            font-weight: 500;
        }

        .field select,
        .field input {
            background: #050607;
            border: 1px solid #1b2028;
            color: #eef2f6;
            border-radius: 7px;
            padding: 9px 11px;
            font-size: 13px;
            font-family: inherit;
            width: 100%;
            outline: none;
        }

        .field select:focus,
        .field input:focus {
            border-color: #2dd4ea;
            box-shadow: 0 0 0 3px rgba(45, 212, 234, .12);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-check {
            width: 100%;
            padding: 11px 16px;
            border-radius: 7px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            background: linear-gradient(135deg, #2dd4ea, #17a8bd);
            color: #03181c;
            box-shadow: 0 10px 24px -12px rgba(45, 212, 234, .5);
            transition: filter .15s ease;
        }

        .btn-check:hover {
            filter: brightness(1.08);
        }

        .result-box {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 12.5px;
            line-height: 1.6;
            min-height: 24px;
        }

        .result-ok {
            background: rgba(52, 211, 153, .13);
            border: 1px solid rgba(52, 211, 153, .3);
            color: #34d399;
        }

        .result-conflict {
            background: rgba(255, 84, 112, .13);
            border: 1px solid rgba(255, 84, 112, .4);
            color: #ffc7d1;
        }

        .result-empty {
            background: #050607;
            border: 1px solid #1b2028;
            color: #565f6b;
            text-align: center;
        }

        .alt-suggestion {
            margin-top: 8px;
            color: #34d399;
            font-weight: 600;
        }

        .powered-by {
            text-align: center;
            font-size: 10px;
            color: #565f6b;
            margin-top: 16px;
        }

        .powered-by a {
            color: #2dd4ea;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="widget-wrapper" id="widget-root">
        <div class="widget-header">
            <div class="widget-logo">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
                    <path d="M12 3.2l6.5 2.6v5c0 4.4-2.7 7.9-6.5 9.9-3.8-2-6.5-5.5-6.5-9.9v-5L12 3.2z" stroke="#04141a"
                        stroke-width="1.8" stroke-linejoin="round" />
                    <path d="M8.7 12.4l2.2 2.2 4.4-4.8" stroke="#04141a" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>
            <div>
                <div class="widget-badge">IDEA NAME</div>
                <div class="widget-title">Resource-Clash-Double-Booking-Detector</div>
                <div class="widget-subtitle">Check booking availability instantly</div>
            </div>
        </div>

        <div class="field">
            <label for="w-type">Resource Type</label>
            <select id="w-type">
                <option value="driver">Driver</option>
                <option value="vehicle">Vehicle</option>
                <option value="guide">Guide</option>
                <option value="room">Room</option>
            </select>
        </div>
        <div class="field">
            <label for="w-resource">Resource</label>
            <select id="w-resource"></select>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="w-start">Start Date</label>
                <input id="w-start" type="date" />
            </div>
            <div class="field">
                <label for="w-end">End Date</label>
                <input id="w-end" type="date" />
            </div>
        </div>

        <button type="button" class="btn-check" id="w-check">Check Availability</button>
        <div id="w-result" class="result-box result-empty">Select a resource and dates to check availability.</div>

        <div class="powered-by">
            Powered by <a href="index.html">Resource-Clash-Double-Booking-Detector</a>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="embed.js"></script>
    <script>
        (function () {
            'use strict';

            // Load seed data so the widget can check against existing bookings
            const seed = loadState();
            ClashGuard.init({
                resources: seed.resources,
                bookings: seed.bookings,
                theme: 'dark'
            });

            const typeSel = document.getElementById('w-type');
            const resSel = document.getElementById('w-resource');
            const startIn = document.getElementById('w-start');
            const endIn = document.getElementById('w-end');
            const checkBtn = document.getElementById('w-check');
            const resultDiv = document.getElementById('w-result');

            const today = new Date().toISOString().slice(0, 10);
            startIn.value = today;
            endIn.value = today;

            function populateResources() {
                resSel.innerHTML = '';
                ClashGuard.getResources(typeSel.value).forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.name;
                    resSel.appendChild(opt);
                });
            }

            populateResources();
            typeSel.addEventListener('change', populateResources);

            checkBtn.addEventListener('click', function () {
                if (!resSel.value) {
                    resultDiv.className = 'result-box result-conflict';
                    resultDiv.innerHTML = 'Please select a resource first.';
                    return;
                }
                if (!startIn.value || !endIn.value) {
                    resultDiv.className = 'result-box result-conflict';
                    resultDiv.innerHTML = 'Please select both start and end dates.';
                    return;
                }
                if (endIn.value < startIn.value) {
                    resultDiv.className = 'result-box result-conflict';
                    resultDiv.innerHTML = 'End date must be on or after start date.';
                    return;
                }

                const res = ClashGuard.checkBooking(typeSel.value, resSel.value, startIn.value, endIn.value);
                if (res.hasConflict) {
                    let html = `<strong>⚠ Conflict detected!</strong><br>${res.conflicts.length} existing booking(s) overlap with these dates.`;
                    res.conflicts.forEach(c => {
                        html += `<br>• <b>${c.tripName || 'Booking'}</b> (${c.startDate} → ${c.endDate})`;
                    });
                    if (res.alternatives.length) {
                        html += `<div class="alt-suggestion">✓ Alternative: <b>${res.alternatives[0].name}</b> is free for these dates.</div>`;
                    }
                    resultDiv.className = 'result-box result-conflict';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.className = 'result-box result-ok';
                    resultDiv.innerHTML = '<strong>✓ Available!</strong> No conflicts found. This resource is free for the selected dates.';
                }
            });

            // Listen for conflict events
            ClashGuard.on('conflict', function (e) {
                console.log('[ClashGuard Widget] Conflict detected:', e);
            });
        })();
    </script>
</body>

</html>
